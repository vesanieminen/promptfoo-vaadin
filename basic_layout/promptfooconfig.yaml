# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# promptfoo port of the `basic_layout` benchmark from the agentic-dx-improvement
# harness. Two agents — Codex and Claude — solve the Vaadin layout task starting
# from the Vaadin skeleton; both solutions are graded against rubric.md.
#
# Unlike the bespoke shell harness, the SOLVERS are promptfoo's BUILT-IN agentic
# providers (just like the repo-root promptfooconfig.yaml uses native providers),
# so there is no solve.sh / wrapper scripts and no model env knobs. The only
# custom code is seed.js (seeds the workspaces) and the two Python graders.
#
# Run from the repo root via the wrapper (warms Maven, --no-cache, run-scoped auth):
#   bash basic_layout/run.sh
#   npx promptfoo@latest view
#
# Auth (run.sh handles this): both the SOLVER and the rubric VERIFIER need Claude
# auth, and on macOS the verifier's ISOLATED CLAUDE_CONFIG_DIR can't read the
# Keychain login. run.sh resolves ONE run-scoped credential and injects it into the
# bench process only (never your rc files) — YOUR CHOICE of:
#   • ANTHROPIC_API_KEY      (sk-ant-api...) → API-key billing (solver + verifier), or
#   • CLAUDE_CODE_OAUTH_TOKEN (sk-ant-oat...) → Claude subscription billing.
# See run.sh / README.md.
#
# See basic_layout/README.md for prerequisites and what was intentionally skipped.

description: "agentic-dx basic_layout — Codex vs Claude solve the Vaadin layout task, both graded by the rubric verifier"

# ---------------------------------------------------------------------------
# SEED — a beforeAll extension hook that (re)creates one fresh workspace per
# solver provider (workspaces/codex, workspaces/claude) from the
# agentic-dx-improvement sources: skeleton + task files, rubric stripped, a
# per-provider server port baked in, and an isolated Claude home for the
# verifier. Replaces the seeding half of the old solve.sh + all of claude-home.sh.
# Override the source location with AGENTIC_DX_DIR (default: sibling checkout).
# ---------------------------------------------------------------------------
extensions:
  - file://seed.js:seed

# ---------------------------------------------------------------------------
# PROMPT — base_prompt_vaadin.md plus the "task is in the cwd" preamble. The
# real instructions (task.md) and reference PNGs are seeded into each workspace
# by seed.js and read by the agent from its working_dir. Keep in sync with:
#   ../agentic-dx-improvement/problems/base_prompt_vaadin.md
# ---------------------------------------------------------------------------
prompts:
  - |
    The task description and any reference assets are in the current working directory.

    - Solve the task specified in `task.md`.
    - If there is a `README.md` file, check it as well.
    - Prefer Vaadin built-in styles to custom ones.
    - Use the locally installed JDK 25 and Maven.
    - Use `dev.sh` to run the application in development mode. The dev server has Spring Boot Dev Tools enabled.
    - Use `run.sh` to run the application in production mode. When running in production mode, the application must be restarted for any changes to show up (including CSS changes).
    - When asked to write UI tests, write browserless UI tests.
    - If something can be verified using both a browserless UI test and using Playwright, prefer the browserless UI test.
    - Use Playwright to look at the end result in a browser.
      - It is already installed (chromium) and available as an MCP.
      - Use browser_snapshot / DOM queries for behavior verification; reserve screenshots for layout/visual rubric items.

    The app's HTTP port is set in `app/src/main/resources/application.properties`
    (`server.port`); use that port (not necessarily 8080) when previewing in a browser.

# ---------------------------------------------------------------------------
# PROVIDERS — the two SOLVERS, as promptfoo's native agentic providers. Config
# is operational (working dir, full file/command access, MCP, auth) plus a PINNED
# model per provider — Claude on claude-opus-4-8, Codex on gpt-5.5 (in its id).
# The model is pinned for reproducibility, NOT perf-tuned: without it the
# claude-code provider would run on the ambient default model (varies by
# machine/login). There is still no effort/temperature tuning. Both authenticate
# via a subscription, not an API key:
#   • Codex  → built-in Codex provider; reuses the `codex login` (ChatGPT) state
#     when OPENAI_API_KEY / CODEX_API_KEY are unset.
#   • Claude → built-in Claude Code (agentic) provider; `apiKeyRequired: false`
#     reuses CLAUDE_CODE_OAUTH_TOKEN / the Claude Code login.
#
# Each runs in its OWN working_dir (seeded above) on its OWN baked port, so the
# two rows are safe to run together with `--max-concurrency 2`. Playwright is
# registered per provider as an in-memory (`--isolated`) browser so concurrent
# solvers don't deadlock on a shared profile lock.
# ---------------------------------------------------------------------------
providers:
  - id: openai:codex:gpt-5.5            # model lives in the id, like the root config
    label: codex
    config:
      working_dir: workspaces/codex     # resolved relative to this config's dir
      sandbox_mode: danger-full-access  # solving = write files, run mvn, start a server
      skip_git_repo_check: true
      # Vaadin skills: seed.js installs agent-skills' `skills/` into this
      # workspace's `.agents/skills/` — Codex's own skill-discovery location — so
      # Codex solves WITH the same Vaadin guidance the Claude row gets from the
      # plugin (parity). promptfoo auto-detects their use into metadata.skillCalls.
      cli_config:                       # Codex has no first-class mcp/plugin key; config goes via cli_config
        mcp_servers:
          playwright:
            command: npx
            args: ["--yes", "@playwright/mcp@latest", "--browser", "chromium", "--headless", "--isolated"]
          vaadin:                       # the Vaadin docs MCP the agent-skills plugin bundles (parity with Claude)
            url: "https://mcp.vaadin.com/docs"

  - id: anthropic:claude-code           # = anthropic:claude-agent-sdk (the agentic Claude Code provider)
    label: claude
    config:
      apiKeyRequired: false             # don't force an API key: lets the provider fall back to a subscription (CLAUDE_CODE_OAUTH_TOKEN / `claude /login`) when ANTHROPIC_API_KEY is unset. If run.sh's API-key mode sets ANTHROPIC_API_KEY, the provider still uses it (this flag only gates the no-key error).
      model: claude-opus-4-8            # PINNED for reproducibility — without it the provider uses the ambient default model (which varies by machine/login)
      working_dir: workspaces/claude
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      allow_all_tools: true
      setting_sources: []               # ignore the user's personal settings/plugins → clean benchmark
      plugins:                          # the Vaadin agent-skills plugin (vaadin-skills: layouts, responsive-layouts, …; bundles the Vaadin docs MCP)
        - type: local
          path: ../../agentic-dx-improvement/agent-skills
      mcp:
        servers:
          - name: playwright
            command: npx
            args: ["--yes", "@playwright/mcp@latest", "--browser", "chromium", "--headless", "--isolated"]

# ---------------------------------------------------------------------------
# TEST — a single agentic task (no per-case vars). Each grader locates its row's
# workspace from the provider in `context`. Two graders:
#   1. grade_static.py  — deterministic source checks (cheap gate): the rubric's
#      Structure + Vaadin-specific bullets that are verifiable by reading code.
#   2. grade_rubric.py  — the agentic verifier (verify_prompt.md + rubric.md):
#      runs the app + Playwright across viewports and returns the /21 (/24) score.
# file:// paths resolve relative to THIS config's directory.
# ---------------------------------------------------------------------------
tests:
  - description: "basic_layout implemented from the Vaadin skeleton, graded by the rubric"
    assert:
      - type: python
        value: file://grade_static.py
        weight: 1
      - type: python
        value: file://grade_rubric.py
        weight: 3
    # ADR 0002: the rubric is a FLOOR, not the target. The weighted score must
    # clear this floor for the test to pass; tune via env on the graders.
    threshold: 0.6
