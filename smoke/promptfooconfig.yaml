# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# AUTH SMOKE TEST — quickly confirm Claude works for BOTH paths the basic_layout
# benchmark needs, with no Maven / server / Playwright (runs in well under a minute):
#
#   1. EVAL / solver  → the agentic `anthropic:claude-code` provider answers a
#                       trivial prompt. Authenticates via your default Claude Code
#                       login (on macOS, the Keychain). No token needed.
#   2. TOKEN auth     → verify_auth.py shells out to `claude` under an ISOLATED
#                       CLAUDE_CONFIG_DIR — the strictest case, forcing token-only
#                       auth (on macOS an isolated config dir can't read the Keychain,
#                       so it needs a run-scoped CLAUDE_CODE_OAUTH_TOKEN). The
#                       basic_layout verifier USED to run this way (old
#                       grade_rubric.py); it's now a provider that can use the
#                       Keychain, so a token is OPTIONAL — this stays as a defensive
#                       check of the token path. See docs/ADR-verifier-as-provider.md.
#
# Run it:  bash smoke/run.sh          (injects the run-scoped token — see README.md)
# Expect:  token present → BOTH assertions PASS.
#          no token      → solver PASSES, token-auth check FAILS (with a clear reason;
#                          the benchmark itself still works via your Keychain login).

description: "Claude auth smoke test — eval (solver) + verification paths"

prompts:
  - "Reply with exactly this and nothing else: SOLVER_OK"

providers:
  - id: anthropic:claude-code
    label: claude
    config:
      apiKeyRequired: false          # reuse your Claude Code login (Keychain) — no API key
      model: claude-opus-4-8         # pin for reproducibility
      working_dir: scratch           # empty scratch dir; the task is text-only
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      allow_all_tools: true
      setting_sources: []            # ignore personal settings/plugins → clean test

tests:
  - description: "Claude solver + verifier authenticate"
    assert:
      # (1) EVAL / solver auth: the agentic provider authenticated and replied.
      - type: contains
        value: "SOLVER_OK"
      # (2) VERIFICATION auth: isolated-config `claude` authenticates (needs token).
      - type: python
        value: file://verify_auth.py
