# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# AUTH SMOKE TEST — quickly confirm Claude works for BOTH paths the basic_layout
# benchmark needs, with no Maven / server / Playwright (runs in well under a minute):
#
#   1. EVAL / solver  → the agentic `anthropic:claude-code` provider answers a
#                       trivial prompt. Authenticates via your default Claude Code
#                       login (on macOS, the Keychain). No token needed.
#   2. CLI auth        → verify_auth.py shells out to a trivial `claude -p` on the
#                        SAME path you're about to run the benchmark on:
#                          • no token  → DEFAULT config dir (your Keychain login) —
#                            the path the provider-based verifier now uses;
#                          • token set → ISOLATED CLAUDE_CONFIG_DIR (strictest, no
#                            Keychain) — asserts the token itself authenticates.
#                        (The old grade_rubric.py subprocess always forced the
#                        isolated path; the verifier is now a provider, so a token is
#                        OPTIONAL. See docs/ADR-verifier-as-provider.md.)
#
# Run it:  bash smoke/run.sh          (injects a token only if you have one — see README.md)
# Expect:  logged in (token or Keychain) → BOTH assertions PASS.
#          not authenticated            → BOTH FAIL with a clear reason
#                                          (`claude /login`, or supply a token).

description: "Claude auth smoke test — eval (solver) + verification paths"

prompts:
  - "Reply with exactly this and nothing else: SOLVER_OK"

providers:
  - id: anthropic:claude-code
    label: claude
    config:
      apiKeyRequired: false          # reuse your Claude Code login (Keychain) — no API key
      model: claude-opus-4-8         # pin for reproducibility
      working_dir: scratch           # empty scratch dir; the task is text-only
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      allow_all_tools: true
      setting_sources: []            # ignore personal settings/plugins → clean test

tests:
  - description: "Claude solver + verifier authenticate"
    assert:
      # (1) EVAL / solver auth: the agentic provider authenticated and replied.
      - type: contains
        value: "SOLVER_OK"
      # (2) VERIFICATION auth: `claude` authenticates on the path the benchmark uses
      #     (default-config Keychain login when no token; isolated-config token when set).
      - type: python
        value: file://verify_auth.py
